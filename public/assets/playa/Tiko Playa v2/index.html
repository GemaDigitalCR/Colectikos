<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f4f2c">
<title>Tiko Playa | Colectikos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2817;--ink2:#806a55;--cream:#fff8e8;--line:#ecd9b0;
  --em:#10b981;--emd:#047857;--amb:#f59e0b;--ambd:#b45309;--red:#ef4444;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --lift:0 2px 0 #dccaa4,0 6px 16px rgba(8,45,35,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0f4f2c;color:var(--ink);
  font-family:Fredoka,ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
svg.i{width:18px;height:18px;flex:none}

/* ---------- top HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;margin:0 auto;max-width:560px;
  padding:calc(8px + var(--sat)) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.row{display:flex;gap:6px;align-items:center}
.ib{width:40px;height:40px;border-radius:14px;border:0;background:#fff;display:grid;place-items:center;
  box-shadow:var(--lift);flex:none;text-decoration:none;color:var(--ink);transition:transform .08s}
.ib:active{transform:translateY(2px);box-shadow:0 0 0 #dccaa4,0 2px 6px rgba(8,45,35,.2)}
.ib svg{width:20px;height:20px}
.name{flex:1;min-width:0;height:40px;border-radius:14px;border:0;background:#fff;display:flex;align-items:center;
  gap:8px;padding:0 10px 0 4px;box-shadow:var(--lift);text-align:left}
.name img{width:32px;height:32px;border-radius:10px;background:#d1fae5;object-fit:cover;flex:none}
.name span{min-width:0;flex:1}
.name small{display:block;font-size:9px;font-weight:700;letter-spacing:.13em;color:var(--ambd);line-height:1.1}
.name b{display:block;font-size:15px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name svg{width:14px;height:14px;color:var(--ink2)}

.stats{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;width:100%;padding:0;border:0;background:#fff;
  border-radius:16px;box-shadow:var(--lift);overflow:hidden;text-align:left}
.st{padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.st+.st{border-left:1px solid #f3e8cf}
.st .v{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:600;line-height:1.15}
.st .v svg{width:15px;height:15px}
.st .l{font-size:8.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.st.coin{background:linear-gradient(180deg,#fff6dc,#ffe7a8);flex-direction:row;gap:7px;justify-content:flex-start;padding-left:8px}
.ring{position:relative;width:32px;height:32px;flex:none}
.ring svg{position:absolute;inset:0;width:32px;height:32px}
.ring .pg{transform:rotate(-90deg);transform-origin:50% 50%}
.coin .n{font-size:18px;font-weight:700;line-height:1;color:#7c3d06}
.coin .s{font-size:10px;font-weight:600;color:#a15c0e;line-height:1.2;white-space:nowrap}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.22)}}

.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.m{background:rgba(255,255,255,.94);border-radius:11px;padding:4px 7px;display:flex;align-items:center;gap:5px;
  box-shadow:0 3px 10px rgba(8,45,35,.2);font-size:11px;font-weight:600;min-width:0}
.m svg{width:14px;height:14px}
.m .bar{flex:1;height:6px;border-radius:9px;background:#efe4cc;overflow:hidden;min-width:14px}
.m .bar i{display:block;height:100%;border-radius:9px;width:0;transition:width .45s}
.m.over{background:#fee2e2;color:#991b1b;animation:wig .5s 2}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

#toasts{display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none!important;margin-top:2px}
.toast{background:rgba(44,30,16,.95);color:#fff;border-radius:14px;padding:8px 13px 8px 8px;font-size:13px;font-weight:500;
  line-height:1.25;display:flex;gap:9px;align-items:center;max-width:100%;box-shadow:0 8px 22px rgba(0,0,0,.3);animation:pop .28s}
.toast.plain{padding-left:13px}
.toast img{width:32px;height:32px;border-radius:10px;background:#d1fae5;object-fit:cover;flex:none}
.toast.good{background:#065f46}.toast.bad{background:#9f1d1d}
.toast.out{opacity:0;transform:translateY(-6px);transition:.25s}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.96)}}

/* ---------- bottom ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;pointer-events:none;z-index:5}
#bottom>*{pointer-events:auto}
.mapctl{align-self:flex-end;display:flex;gap:6px;margin:0 10px 8px;max-width:560px}
.mapctl .ib{width:38px;height:38px;border-radius:13px}
.panel{background:var(--cream);border-radius:22px 22px 0 0;border-top:3px solid #fff;width:100%;max-width:560px;margin:0 auto;
  box-shadow:0 -8px 26px rgba(8,40,30,.3);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{display:block;width:100%;height:16px;border:0;background:none;padding:0}
.grab::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#dfcda6;margin:6px auto 0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600;background:transparent;
  color:var(--ink2);display:flex;gap:5px;align-items:center}
.tab svg{width:15px;height:15px}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.rail{display:flex;gap:8px;overflow-x:auto;padding:4px 10px calc(10px + var(--sab));scroll-snap-type:x proximity;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dock.min .rail{display:none}.dock.min .tabs{padding-bottom:calc(8px + var(--sab))}
.card{flex:none;width:94px;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--line);padding:14px 5px 7px;
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;scroll-snap-align:start;transition:transform .08s}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.card img{width:70px;height:56px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(60,40,10,.25))}
.card .n{font-size:11.5px;font-weight:600;line-height:1.1;text-align:center;height:26px;display:flex;align-items:center}
.card .c{display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;background:#fff1c9;color:#8a4708;
  border-radius:9px;padding:2px 8px 2px 3px}
.card .c svg{width:15px;height:15px}
.card .dot{position:absolute;top:6px;left:7px;width:8px;height:8px;border-radius:50%}
.card .sz{position:absolute;top:3px;right:7px;font-size:9.5px;font-weight:600;color:var(--ink2)}
.card.no img{filter:grayscale(.85) opacity(.6)}
.card.no .c{background:#eee;color:#8b8b8b}

.act{padding:12px 12px calc(12px + var(--sab))}
.act .top{display:flex;gap:10px;align-items:center}
.act .thumb{width:66px;height:62px;object-fit:contain;flex:none;background:#fff;border-radius:15px;box-shadow:0 2px 0 var(--line);padding:4px}
.act .info{flex:1;min-width:0}
.act .cat{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.act h3{margin:0;font-size:18px;font-weight:600;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;border-radius:8px;padding:2px 6px;background:#fff;
  box-shadow:0 1px 0 var(--line)}
.chip svg{width:13px;height:13px}
.act .x{align-self:flex-start;width:32px;height:32px;border-radius:11px;box-shadow:0 2px 0 var(--line)}
.act .x svg{width:16px;height:16px}
.hint{font-size:12.5px;color:var(--ink2);margin:9px 2px 0;min-height:16px;font-weight:500}
.hint.bad{color:#b91c1c}
.btns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;min-width:0;height:50px;border:0;border-radius:16px;font-size:16px;font-weight:600;display:flex;align-items:center;
  justify-content:center;gap:6px;color:#fff;background:var(--em);box-shadow:0 4px 0 var(--emd);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--emd)}
.btn svg{width:19px;height:19px}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.narrow{flex:0 0 32%}
.btn.warn{background:var(--amb);box-shadow:0 4px 0 var(--ambd)}
.btn.danger{background:var(--red);box-shadow:0 4px 0 #b91c1c}
.btn:disabled{background:#d8d0be;box-shadow:0 4px 0 #bdb49f;color:#fff;transform:none}

/* ---------- modal sheets ---------- */
#modal{position:absolute;inset:0;background:rgba(10,36,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--cream);width:100%;max-width:560px;border-radius:24px 24px 0 0;border-top:3px solid #fff;
  padding:16px 16px calc(18px + var(--sab));max-height:88%;overflow:auto;animation:up .25s ease-out}
.sheet h2{margin:0 0 10px;font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.sheet h2 img{width:36px;height:36px;border-radius:12px;background:#d1fae5;object-fit:cover}
.sheet h2 .ib{margin-left:auto;width:34px;height:34px;box-shadow:0 2px 0 var(--line)}
.rule{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #f0e2c2;font-size:14px;line-height:1.3;font-weight:400}
.rule:first-of-type{border-top:0}
.rule .bx{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.rule b{font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #f0e2c2;font-size:14px}
.kv:first-of-type{border-top:0}.kv b{font-weight:600;text-align:right}
.kv .neg{color:#b91c1c}.kv .pos{color:#047857}
.sub{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:14px 0 2px}
.seg{display:flex;background:#f1e4c5;border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.sheet input{width:100%;height:50px;border-radius:15px;border:2px solid var(--line);background:#fff;padding:0 14px;font:inherit;
  font-size:18px;font-weight:600;color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
.sheet input:focus{border-color:var(--amb)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <section class="panel dock" id="dock"></section>
    <section class="panel act" id="act" hidden></section>
  </div>
  <div id="modal" hidden></div>
</div>

const occ=new Int16Array(N*N);
function rebuild(){occ.fill(-1);S.items.forEach((it,i)=>{const b=B[it.type];it.key=it.c+it.r+(b.w+b.h)/2;for(let r=it.r;r<it.r+b.h;r++)for(let c=it.c;c<it.c+b.w;c++)occ[r*N+c]=i;});
  for(const w of walkers){if(occ[w.fr*N+w.fc]>=0||occ[w.tr*N+w.tc]>=0){const sp=freeTile();if(sp){w.fc=w.tc=sp.c;w.fr=w.tr=sp.r;w.p=1;}}}}
function canPlace(type,c,r){const b=B[type];if(c<0||r<0||c+b.w>N||r+b.h>N)return false;for(let y=r;y<r+b.h;y++)for(let x=c;x<c+b.w;x++)if(occ[y*N+x]>=0)return false;return true}
function freeTile(){for(let i=0;i<60;i++){const c=(Math.random()*N)|0,r=(Math.random()*N)|0;if(occ[r*N+c]<0)return{c,r}}return null}

function derive(){
  let o=0,att=0,pol=0;const cap={lodging:0,food:0,fun:0};
  for(const it of S.items){const b=B[it.type];o+=b.w*b.h;att+=b.attract;pol+=b.pol;if(cap[b.cat]!=null)cap[b.cat]+=b.cap;}
  if(moving){const b=B[moving.type];o+=b.w*b.h;att+=b.attract;pol+=b.pol;if(cap[b.cat]!=null)cap[b.cat]+=b.cap;}
  const dens=o/(N*N);let df=1;if(dens>.4)df=Math.max(0,1-(dens-.4)*2.5);
  const caps={lodging:40+cap.lodging,food:40+cap.food,fun:40+cap.fun},v=S.visitors;
  const over={lodging:v>caps.lodging,food:v>caps.food,fun:v>caps.fun},any=over.lodging||over.food||over.fun;
  const pollution=Math.max(0,pol),pf=Math.max(.1,1-.005*pollution);
  const eff=Math.floor(att*df*(any?.1:1)*pf);
  return{dens,df,caps,over,any,att,pollution,pf,eff,income:Math.floor(2*Math.pow(v,.4))};
}

    x.strokeStyle=i%2?'rgba(255,255,255,.26)':'rgba(150,100,45,.14)';x.lineWidth=1.5;x.stroke();}
  const edge=(a,b,k)=>{for(const[w,al]of[[110,.06],[64,.08],[30,.1]]){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.strokeStyle=`rgba(96,62,14,${al*k})`;x.lineWidth=w;x.stroke();}};
  edge(iso(0,0),iso(0,N),1);edge(iso(0,0),iso(N,0),1);edge(iso(N,0),iso(N,N),.7);
  for(let i=0;i<52;i++){const p=iso(.6+R()*23.8,R()<.6?16+R()*8.2:R()*24),k=R();
    if(k<.38){x.fillStyle='#fff6ee';x.strokeStyle='#dfae96';x.lineWidth=.8;x.beginPath();x.arc(p.x,p.y,3.4,Math.PI,0);x.lineTo(p.x,p.y+2.6);x.closePath();x.fill();x.stroke();
      for(let q=-2;q<=2;q++){x.beginPath();x.moveTo(p.x,p.y+2.2);x.lineTo(p.x+q*1.5,p.y-2.6);x.stroke();}}

/* --- visitors walking the sand --- */
const walkers=[],DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const WC=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316'],SK=['#f6c9a0','#e0a877','#c68b59','#8d5a3b'],HT=['#fff','#fde68a','#fca5a5','#93c5fd','#3a2817'];
function stepWalkers(dt){
  const want=Math.min(36,S.visitors);
  while(walkers.length<want){const sp=freeTile();if(!sp)break;walkers.push({wk:1,fc:sp.c,fr:sp.r,tc:sp.c,tr:sp.r,p:1,dir:DIRS[(Math.random()*4)|0],c:sp.c+.5,r:sp.r+.5,
    col:(Math.random()*WC.length)|0,skin:(Math.random()*SK.length)|0,hat:(Math.random()*HT.length)|0,ph:Math.random()*7,sp:.55+Math.random()*.55,wait:Math.random()*2});}
  if(walkers.length>want)walkers.length=want;
  for(const w of walkers){
    if(w.wait>0){w.wait-=dt;}
    else{w.p+=dt*w.sp;
      if(w.p>=1){w.fc=w.tc;w.fr=w.tr;w.p=0;const o=[];
        for(const d of DIRS){const nc=w.fc+d[0],nr=w.fr+d[1];if(nc<0||nr<0||nc>=N||nr>=N||occ[nr*N+nc]>=0)continue;o.push(d);}
        if(!o.length){w.wait=1.5;w.p=1;}
        else{const fwd=o.find(d=>d===w.dir);let pk;if(fwd&&Math.random()<.72)pk=fwd;else{const nb=o.filter(d=>!(d[0]===-w.dir[0]&&d[1]===-w.dir[1]));const a=nb.length?nb:o;pk=a[(Math.random()*a.length)|0];}
          w.dir=pk;w.tc=w.fc+pk[0];w.tr=w.fr+pk[1];if(Math.random()<.1)w.wait=1+Math.random()*3.5;}}}
    w.c=w.fc+.5+(w.tc-w.fc)*w.p;w.r=w.fr+.5+(w.tr-w.fr)*w.p;w.key=w.c+w.r;}
}
function drawWalker(w,t){const p=iso(w.c,w.r),mv=w.wait>0?0:1,bob=mv*Math.abs(Math.sin(t*9+w.ph))*1.7,x=p.x,y=p.y-bob,sw=mv*Math.sin(t*9+w.ph)*1.6;
  ctx.fillStyle='rgba(60,35,10,.24)';ctx.beginPath();ctx.ellipse(p.x,p.y+.5,6,2.8,0,0,7);ctx.fill();
  ctx.fillStyle='#5a4332';ctx.fillRect(x-3.2+sw*.4,y-6.5,2.6,6.5);ctx.fillRect(x+.6-sw*.4,y-6.5,2.6,6.5);
  ctx.fillStyle=WC[w.col];rrect(ctx,x-4.6,y-15.5,9.2,10.2,3.2);ctx.fill();
  ctx.fillStyle=SK[w.skin];ctx.beginPath();ctx.arc(x,y-18.8,4.2,0,7);ctx.fill();
  ctx.fillStyle=HT[w.hat];ctx.beginPath();ctx.ellipse(x,y-21,5.8,1.9,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(x,y-21.3,3.4,Math.PI,0);ctx.fill();}

/* --- gulls and floating effects --- */
const gulls=[0,1,2,3].map(i=>({x:-900+Math.random()*1800,y:150+Math.random()*700,vx:(20+Math.random()*16)*(i%2?1:-1),vy:8*(Math.random()-.5),ph:Math.random()*6}));
const fx=[];const BORN=new Map();
function coinPop(wx,wy,txt){fx.push({k:'coin',x:wx,y:wy,t0:performance.now(),txt});}
function burst(wx,wy){fx.push({k:'burst',x:wx,y:wy,t0:performance.now()});}

/* --- interaction state --- */
let mode='idle',placing=null,moving=null,selected=null,ghost=null,sellArmed=false,tickAcc=0,lastWarn=0;

function draw(now){
  const t=now/1000;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0d4526';ctx.fillRect(0,0,cv.width,cv.height);
  const k=dpr*cam.z;ctx.setTransform(k,0,0,k,dpr*(vw/2-cam.x*cam.z),dpr*(vh/2-cam.y*cam.z));
  const A=s2w(0,0),Z=s2w(vw,vh),X0=A.x,Y0=A.y,X1=Z.x,Y1=Z.y,VW=X1-X0,VH=Y1-Y0;
  const q=[unIso(X0,Y0),unIso(X1,Y0),unIso(X0,Y1),unIso(X1,Y1)];
  const c0=Math.floor(Math.min(q[0].c,q[1].c,q[2].c,q[3].c))-1,c1=Math.ceil(Math.max(q[0].c,q[1].c,q[2].c,q[3].c))+1,r1=Math.max(q[0].r,q[1].r,q[2].r,q[3].r)+2;

  /* jungle canopy */
  if(PAT.canopy){ctx.fillStyle=PAT.canopy;ctx.fillRect(X0,Y0,VW,VH);}
  ctx.fillStyle='rgba(4,30,16,.3)';ctx.fillRect(X0,Y0,VW,VH);

  /* ocean */
  if(r1>25){
    band(ctx,c0,c1,25,r1);let g=shoreGrad(ctx,25,49);g.addColorStop(0,'#9aeedd');g.addColorStop(.05,'#57d9d1');g.addColorStop(.18,'#25bcd0');g.addColorStop(.48,'#1593c6');g.addColorStop(1,'#0a5c9c');
    ctx.fillStyle=g;ctx.fill();
    if(PAT.caust){ctx.save();ctx.clip();ctx.globalAlpha=.3;ctx.globalCompositeOperation='screen';
      PAT.caust.setTransform(new DOMMatrix([.55,.275,-.55,.275,(t*10)%2816,(t*6)%2816]));ctx.fillStyle=PAT.caust;ctx.fillRect(X0,Y0,VW,VH);ctx.restore();}
    ctx.lineCap='round';ctx.lineJoin='round';
    for(let i=0;i<4;i++){const ph=(t*.085+i/4)%1,rr=25.5+(1-ph)*7,al=Math.sin(Math.PI*ph)*.5;ctx.beginPath();
      for(let c=c0;c<=c1;c+=.75){const p=iso(c,rr+.22*Math.sin(c*.6+i*2.1+t*.7));c===c0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
      ctx.setLineDash([46,30,90,24,22,40]);ctx.lineDashOffset=i*53+t*4;ctx.strokeStyle=`rgba(255,255,255,${al})`;ctx.lineWidth=2.4;ctx.stroke();}
    ctx.setLineDash([]);
  }
  /* coast sand + playable sand */
  band(ctx,c0,c1,23.3,25);ctx.fillStyle=PAT.sand||'#f1d188';ctx.fill();
  band(ctx,c0,c1,23.3,23.75);{const g=shoreGrad(ctx,23.3,23.75);g.addColorStop(0,'rgba(20,70,30,.34)');g.addColorStop(1,'rgba(20,70,30,0)');ctx.fillStyle=g;ctx.fill();}
  if(SANDC.width>1)ctx.drawImage(SANDC,-800,0,1600,800);
  /* wet sand, swash and foam */
  band(ctx,c0,c1,24.25,25.02);{const g=shoreGrad(ctx,24.25,25);g.addColorStop(0,'rgba(150,100,48,0)');g.addColorStop(1,'rgba(140,96,48,.46)');ctx.fillStyle=g;ctx.fill();}
  const edge=c=>24.8+.17*Math.sin(t*.9+c*.5)+.06*Math.sin(t*1.9+c*1.7);
  ctx.beginPath();for(let c=c0;c<=c1;c+=.5){const p=iso(c,edge(c));c===c0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
  {let p=iso(c1,25.5);ctx.lineTo(p.x,p.y);p=iso(c0,25.5);ctx.lineTo(p.x,p.y);ctx.closePath();ctx.fillStyle='rgba(120,228,214,.62)';ctx.fill();}
  for(const[off,al,lw]of[[0,.95,3],[.16,.5,1.6],[.34,.28,1.2]]){ctx.beginPath();for(let c=c0;c<=c1;c+=.5){const p=iso(c,edge(c)+off+.03*Math.sin(c*2.3+t));c===c0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
    ctx.strokeStyle=`rgba(255,255,255,${al})`;ctx.lineWidth=lw;ctx.stroke();}

  /* build grid */
  if(mode==='place'||mode==='move'){ctx.beginPath();for(let i=0;i<=N;i++){let a=iso(i,0),b=iso(i,N);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);a=iso(0,i);b=iso(N,i);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}
    ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=Math.max(.6,1/cam.z*.8);ctx.stroke();
    ctx.beginPath();dia(ctx,0,0,N,N);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.stroke();}

  /* ground shadows */
  ctx.fillStyle='rgba(70,42,8,.2)';
  for(const it of S.items){const b=B[it.type];ctx.beginPath();dia(ctx,it.c-.06,it.r-.06,b.w+.2,b.h+.2);ctx.fill();}
  if(selected){const b=B[selected.type],pad=.34+.05*Math.sin(t*5);ctx.beginPath();dia(ctx,selected.c-pad,selected.r-pad,b.w+pad*2,b.h+pad*2);ctx.fillStyle='rgba(251,191,36,.55)';ctx.fill();
    ctx.setLineDash([8,6]);ctx.lineDashOffset=-t*20;ctx.strokeStyle='#fff';ctx.lineWidth=2.6;ctx.stroke();ctx.setLineDash([]);}

  /* depth-sorted objects */
  const list=[];
  for(const d of DECOR){const p=iso(d.c,d.r);if(p.x<X0-70||p.x>X1+70||p.y<Y0-10||p.y>Y1+150)continue;list.push(d);}
  for(const it of S.items)list.push(it);
  for(const w of walkers)list.push(w);
  list.sort((a,b)=>a.key-b.key);
  for(const o of list){
    if(o.wk)drawWalker(o,t);
    else if(o.k==='bush'){const p=iso(o.c,o.r),w=50*o.s;ctx.drawImage(BUSH[o.v],p.x-w/2,p.y-w*.72,w,w*.8125);}
    else if(o.k==='palm'){const p=iso(o.c,o.r);drawSprite('palmera',p.x,p.y+8,64*1.25*o.s,o.f);}
    else if(o.k==='sign'){const p=iso(o.c,o.r);drawSprite(o.n,p.x,p.y+6,60,false);}
    else{const g=geom(o.type,o.c,o.r);let sc=1;const b0=BORN.get(o.id);if(b0!=null){const u=(now-b0)/420;if(u<1)sc=.55+.45*easeBack(u);else BORN.delete(o.id);}
      if(o===selected)sc*=1+.025*Math.sin(now/170);drawSprite(o.type,g.cx,g.by,g.dw*sc);}
  }

  /* placement ghost */
  if(ghost){const b=B[ghost.type],good=ghost.ok,g=geom(ghost.type,ghost.c,ghost.r);
    const pad=.32+.06*Math.sin(now/200),bob=2.5*Math.sin(now/220);
    ctx.beginPath();dia(ctx,ghost.c-pad,ghost.r-pad,b.w+pad*2,b.h+pad*2);ctx.fillStyle=good?'rgba(16,185,129,.34)':'rgba(239,68,68,.4)';ctx.fill();
    ctx.strokeStyle=good?'rgba(255,255,255,.95)':'#ffe3e3';ctx.lineWidth=2.6;ctx.setLineDash([8,6]);ctx.lineDashOffset=-now/40;ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();dia(ctx,ghost.c,ghost.r,b.w,b.h);ctx.fillStyle=good?'rgba(16,185,129,.55)':'rgba(239,68,68,.6)';ctx.fill();
    ctx.globalAlpha=good?.94:.6;drawSprite(ghost.type,g.cx,g.by-5-bob,g.dw);ctx.globalAlpha=1;
    /* marker above the ghost so small items stay easy to spot */
    const my=g.by-g.dh-16-bob*1.6;ctx.beginPath();ctx.moveTo(g.cx-9,my-9);ctx.lineTo(g.cx+9,my-9);ctx.lineTo(g.cx,my+4);ctx.closePath();
    ctx.fillStyle=good?'#10b981':'#ef4444';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();ctx.fill();}

  /* effects */
  for(let i=fx.length-1;i>=0;i--){const f=fx[i],u=(now-f.t0)/(f.k==='coin'?1500:600);if(u>=1){fx.splice(i,1);continue;}
    if(f.k==='coin'){const y=f.y-44*(1-Math.pow(1-u,2));ctx.globalAlpha=u<.7?1:(1-u)/.3;
      ctx.fillStyle='#b45309';ctx.beginPath();ctx.arc(f.x,y+1,7.6,0,7);ctx.fill();ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(f.x,y,7.6,0,7);ctx.fill();
      ctx.fillStyle='#92400e';ctx.fillRect(f.x-3.2,y-3.4,6.4,1.9);ctx.fillRect(f.x-.95,y-3.4,1.9,7);
      if(f.txt){ctx.font='700 13px Fredoka,system-ui,sans-serif';ctx.lineWidth=3.5;ctx.strokeStyle='rgba(60,30,0,.75)';ctx.strokeText(f.txt,f.x+11,y+4.5);ctx.fillStyle='#fff';ctx.fillText(f.txt,f.x+11,y+4.5);}
      ctx.globalAlpha=1;}
    else{ctx.globalAlpha=1-u;ctx.fillStyle='#fff7c2';for(let j=0;j<8;j++){const a=j*.785,d=14+46*u;ctx.beginPath();ctx.arc(f.x+Math.cos(a)*d,f.y+Math.sin(a)*d*.55-18*u,3.2*(1-u)+.8,0,7);ctx.fill();}ctx.globalAlpha=1;}}
  ctx.lineCap='round';
  for(const gl of gulls){const fl=Math.sin(t*6+gl.ph);
    ctx.fillStyle='rgba(20,40,30,.14)';ctx.beginPath();ctx.ellipse(gl.x+26,gl.y+84,9,3,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(gl.x-11,gl.y-fl*5);ctx.quadraticCurveTo(gl.x-5,gl.y-7-fl*2,gl.x,gl.y);ctx.quadraticCurveTo(gl.x+5,gl.y-7-fl*2,gl.x+11,gl.y-fl*5);
    ctx.strokeStyle='rgba(60,70,80,.55)';ctx.lineWidth=4.2;ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2.6;ctx.stroke();}
}

let last=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000||0);last=now;
  if(camT){const f=Math.min(1,dt*7);cam.x+=(camT.x-cam.x)*f;cam.y+=(camT.y-cam.y)*f;if(camT.z)cam.z+=(camT.z-cam.z)*f;if(Math.abs(camT.x-cam.x)+Math.abs(camT.y-cam.y)<1)camT=null;clampCam();}
  stepWalkers(dt);
  for(const g of gulls){g.x+=g.vx*dt;g.y+=g.vy*dt;if(g.x>1150)g.x=-1150;if(g.x<-1150)g.x=1150;if(g.y<60||g.y>900)g.vy*=-1;}
  tickAcc+=dt;if(tickAcc>=10){tickAcc-=10;tick();}
  const ring=$('#ringp');if(ring)ring.style.strokeDashoffset=String(81.7*(1-tickAcc/10));
  draw(now);requestAnimationFrame(frame);}

/* =====================================================================
   GAME LOGIC
   ===================================================================== */
function tick(){
  const d=derive(),v=S.visitors;let h=0;
  if(d.any){const n=performance.now();if(n-lastWarn>45000||!lastWarn){lastWarn=n;toast(t(d.over.food?'capFood':d.over.lodging?'capLodging':'capFun'),'bad',true,6000);snd('error');}}
  if(d.any&&v>10){h=-Math.floor(.05*v);if(h===0)h=-1;}
  else if(d.eff>0&&!d.any){const e=Math.log2(d.eff+1)/15;h=Math.floor(e);if(Math.random()<e-h)h+=1;}
  const inc=Math.floor(2*Math.pow(v,.4))+((Math.random()<.3&&v>0)?1:0);
  if(h!==0||inc>0){S.visitors=Math.max(0,v+h);S.tik+=inc;save();refresh();
    if(inc>0){snd('coin');const src=S.items.filter(i=>B[i.type].cap>0);const n=Math.min(4,src.length);
      for(let i=0;i<n;i++){const it=src[(Math.random()*src.length)|0],g=geom(it.type,it.c,it.r);setTimeout(()=>coinPop(g.cx-8,g.by-g.dh*.75,i===0?'+'+inc:''),i*140);}}}
}

function setGhost(g){if(g){const b=B[g.type];g.ok=canPlace(g.type,g.c,g.r)&&(mode!=='place'||S.tik>=b.cost);}ghost=g;updateHint();}
function ghostAt(type,wx,wy){const b=B[type],tl=unIso(wx,wy);return{type,c:Math.max(0,Math.min(N-b.w,Math.round(tl.c-b.w/2))),r:Math.max(0,Math.min(N-b.h,Math.round(tl.r-b.h/2)))}}
function viewCenterWorld(){const a=$('#hud').getBoundingClientRect().bottom,b=$('#bottom').getBoundingClientRect().top;return s2w(vw/2,(a+b)/2)}
function nearestFree(type,g){if(canPlace(type,g.c,g.r))return g;const b=B[type];
  for(let d=1;d<N;d++)for(let dr=-d;dr<=d;dr++)for(let dc=-d;dc<=d;dc++){if(Math.max(Math.abs(dc),Math.abs(dr))!==d)continue;const c=g.c+dc,r=g.r+dr;if(canPlace(type,c,r))return{type,c,r};}return g}

function startPlace(type){const b=B[type];
  if(S.tik<b.cost){snd('error');toast(t('hintPoor',{n:fmt(b.cost-S.tik)}),'bad');return;}
  if(moving){S.items.push(moving);moving=null;rebuild();}
  mode='place';placing=type;selected=null;sellArmed=false;snd('tap');
  const w=viewCenterWorld();ghost=nearestFree(type,ghostAt(type,w.x,w.y));showAct();setGhost(ghost);}
function confirmGhost(){
  if(!ghost)return;
  if(!canPlace(ghost.type,ghost.c,ghost.r)){snd('error');toast(t('hintTaken'),'bad');return;}
  if(mode==='place'){const b=B[placing];if(S.tik<b.cost){snd('error');toast(t('hintPoor',{n:fmt(b.cost-S.tik)}),'bad');return;}
    const it={id:uid(),type:placing,c:ghost.c,r:ghost.r};S.items.push(it);S.tik-=b.cost;BORN.set(it.id,performance.now());rebuild();
    const g=geom(it.type,it.c,it.r);burst(g.cx,g.by-g.dh*.35);snd('build');if(navigator.vibrate)navigator.vibrate(12);
    toast(t('built',{n:bn(placing)}),'good');save();
    if(S.tik<b.cost){toast(t('broke',{n:bn(placing)}),'',false,3500);exitMode();}else{setGhost(null);renderAct();refresh();}}
  else if(mode==='move'){moving.c=ghost.c;moving.r=ghost.r;S.items.push(moving);BORN.set(moving.id,performance.now());moving=null;rebuild();snd('move');toast(t('moved'),'good');save();exitMode();}
}
function exitMode(){if(moving){S.items.push(moving);moving=null;rebuild();}mode='idle';placing=null;ghost=null;selected=null;sellArmed=false;showDock();refresh();}
function select(it){mode='select';selected=it;placing=null;ghost=null;sellArmed=false;snd('pick');showAct();
  const g=geom(it.type,it.c,it.r),s=w2s(g.cx,g.by-g.dh/2),top=$('#hud').getBoundingClientRect().bottom+30,bot=$('#bottom').getBoundingClientRect().top-30;
  if(s.y<top||s.y>bot||s.x<40||s.x>vw-40){const mid=(top+bot)/2;camT={x:g.cx,y:g.by-g.dh/2-(mid-vh/2)/cam.z};}}
function startMove(){if(!selected)return;moving=selected;S.items=S.items.filter(i=>i!==moving);rebuild();mode='move';selected=null;snd('tap');showAct();setGhost({type:moving.type,c:moving.c,r:moving.r});}
function sellSelected(){if(!selected)return;if(!sellArmed){sellArmed=true;renderAct();setTimeout(()=>{if(sellArmed){sellArmed=false;if(mode==='select')renderAct();}},3200);return;}
  const b=B[selected.type],back=Math.floor(.5*b.cost),g=geom(selected.type,selected.c,selected.r);
  S.items=S.items.filter(i=>i!==selected);S.tik+=back;rebuild();coinPop(g.cx,g.by-g.dh*.5,'+'+back);snd('sell');toast(t('sold',{n:fmt(back)}),'good');save();exitMode();}

function pick(wx,wy){const arr=[...S.items].sort((a,b)=>b.key-a.key);
  for(const it of arr){const g=geom(it.type,it.c,it.r);if(Math.abs(wx-g.cx)<g.dw*.36&&wy<g.by-g.dh*.08&&wy>g.by-g.dh*.92)return it;}
  const tl=unIso(wx,wy),c=Math.floor(tl.c),r=Math.floor(tl.r);if(c>=0&&r>=0&&c<N&&r<N&&occ[r*N+c]>=0)return S.items[occ[r*N+c]];return null}
function onTap(sx,sy){const w=s2w(sx,sy);
  if(mode==='place'||mode==='move'){const type=mode==='place'?placing:moving.type;snd('tap');setGhost(ghostAt(type,w.x,w.y));return;}
  const it=pick(w.x,w.y);if(it){select(it);return;}
  for(const d of DECOR)if(d.k==='sign'){const p=iso(d.c,d.r);if(Math.abs(w.x-p.x)<30&&w.y<p.y+8&&w.y>p.y-56){snd('pick');toast(SIGN_TIPS[d.n][lang],'',true,4200);return;}}
  if(mode==='select')exitMode();}
function hitGhost(sx,sy){if(!ghost)return false;const w=s2w(sx,sy),b=B[ghost.type],tl=unIso(w.x,w.y),g=geom(ghost.type,ghost.c,ghost.r);
  return(tl.c>ghost.c-.7&&tl.c<ghost.c+b.w+.7&&tl.r>ghost.r-.7&&tl.r<ghost.r+b.h+.7)||(Math.abs(w.x-g.cx)<g.dw*.5&&w.y<g.by+6&&w.y>g.by-g.dh-8)}

/* ---------- pointer input: pan, pinch, tap, drag the ghost ---------- */
const P=new Map();let G=null;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,{x:e.clientX,y:e.clientY});camT=null;
  if(P.size===1){const onG=hitGhost(e.clientX,e.clientY);G={k:'tap',sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,onG};
    if(onG){const b=B[ghost.type],f=iso(ghost.c+b.w/2,ghost.r+b.h/2),s=w2s(f.x,f.y);G.ox=s.x-e.clientX;G.oy=s.y-e.clientY;}}
  else if(P.size===2){const[a,b]=[...P.values()];G={k:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:cam.z,w:s2w((a.x+b.x)/2,(a.y+b.y)/2)};}});
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p||!G)return;p.x=e.clientX;p.y=e.clientY;
  if(G.k==='pinch'){if(P.size<2)return;const[a,b]=[...P.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    cam.z=Math.min(ZMAX,Math.max(zmin(),G.z0*Math.hypot(a.x-b.x,a.y-b.y)/G.d0));cam.x=G.w.x-(mx-vw/2)/cam.z;cam.y=G.w.y-(my-vh/2)/cam.z;clampCam();return;}
  const dx=e.clientX-G.sx,dy=e.clientY-G.sy;
  if(G.k==='tap'&&Math.hypot(dx,dy)>7)G.k=G.onG?'ghost':'pan';
  if(G.k==='pan'){cam.x=G.cx-dx/cam.z;cam.y=G.cy-dy/cam.z;clampCam();}
  else if(G.k==='ghost'&&ghost){const w=s2w(e.clientX+G.ox,e.clientY+G.oy),g=ghostAt(ghost.type,w.x,w.y);if(g.c!==ghost.c||g.r!==ghost.r)setGhost(g);}});
const endPtr=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);
  if(G&&G.k==='tap'&&e.type==='pointerup')onTap(e.clientX,e.clientY);
  if(P.size===1){const p=[...P.values()][0];G={k:'pan',sx:p.x,sy:p.y,cx:cam.x,cy:cam.y};}else if(P.size===0)G=null;};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();camT=null;zoomAt(e.clientX,e.clientY,cam.z*Math.exp(-e.deltaY*.0016));},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(mode!=='idle')exitMode();}});
addEventListener('resize',resize);

let tab='all';
function buildUI(){
  document.documentElement.lang=lang;document.title=(lang==='es'?'Tiko Playa':'Tiko Beach')+' | Colectikos';
  $('#hud').innerHTML=`
  <div class="row">
    <a class="ib" href="/${lang}/community" aria-label="${t('back')}">${ico('back')}</a>
    <button class="name" id="bName" aria-label="${t('rename')}"><img src="${SRC('otico')}" alt=""><span><small>${t('tiko')}</small><b id="vName"></b></span>${ico('pencil')}</button>
    <button class="ib" id="bLang" aria-label="${lang==='es'?'Cambiar a Inglés':'Switch to Spanish'}" style="font-size:12px;font-weight:700;color:var(--ink)">${lang==='es'?'ES':'EN'}</button>
    <button class="ib" id="bHelp" aria-label="${t('help')}">${ico('help')}</button>
    <button class="ib" id="bSound" aria-label="${t('soundOn')}"></button>
  </div>
  <button class="stats" id="bStats" aria-label="${t('report')}">
    <div class="st coin"><div class="ring"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#f3d48a" stroke-width="3"/><circle id="ringp" class="pg" cx="16" cy="16" r="13" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="81.7" stroke-dashoffset="81.7"/></svg>
      <svg viewBox="0 0 24 24" style="inset:6px;width:20px;height:20px"><circle cx="12" cy="12.6" r="9.6" fill="#b45309"/><circle cx="12" cy="11.4" r="9.6" fill="#fbbf24"/><path d="M8.8 8.7h6.4M12 8.7v6.2" stroke="#92400e" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></div>
      <div><div class="n" id="vTik">0</div><div class="s" id="vInc"></div></div></div>
    <div class="st"><div class="v">${fico('person','#059669')}<span id="vVis">0</span></div><div class="l">${t('vis')}</div></div>
    <div class="st"><div class="v">${fico('spark','#db2777')}<span id="vAtt">0</span></div><div class="l">${t('att')}</div></div>
    <div class="st"><div class="v" id="polV">${fico('cloud','#16a34a')}<span id="vPol">0</span></div><div class="l">${t('pol')}</div></div>
  </button>
  <div class="meters">${['lodging','food','fun'].map(c=>`<div class="m" id="m_${c}" title="${t(c)}">${ico(CAT[c].ic,'color:'+CAT[c].col)}<div class="bar"><i style="background:${CAT[c].col}"></i></div><span></span></div>`).join('')}</div>
  <div id="toasts" aria-live="polite"></div>`;
  $('#mapctl').innerHTML=`<button class="ib" id="zOut" aria-label="${t('zoomOut')}">${ico('minus')}</button><button class="ib" id="zIn" aria-label="${t('zoomIn')}">${ico('plus')}</button><button class="ib" id="zFit" aria-label="${t('center')}">${ico('target')}</button>`;
  $('#bName').onclick=openRename;$('#bHelp').onclick=openHelp;$('#bStats').onclick=openReport;
  $('#bLang').onclick=()=>{
    lang = S.lang = (lang === 'es' ? 'en' : 'es');
    save();
    buildUI();
    toast(lang === 'es' ? 'Idioma: Español 🇨🇷' : 'Language: English 🇺🇸', 'good');
  };
  $('#bSound').onclick=()=>{S.sound=!S.sound;save();refresh();if(S.sound)snd('tap');toast(t(S.sound?'soundOn':'soundOff'));};
  $('#zIn').onclick=()=>{camT=null;zoomAt(vw/2,vh/2,cam.z*1.3)};$('#zOut').onclick=()=>{camT=null;zoomAt(vw/2,vh/2,cam.z/1.3)};
  $('#zFit').onclick=()=>{const p=iso(12.5,13.5);camT={x:p.x,y:p.y,z:Math.max(zmin(),Math.min(.6,vw/1150))};};
  renderDock();if(mode!=='idle')renderAct();refresh();
}
function renderDock(){
  const tabs=[['all','grid','#b45309'],['lodging'],['food'],['fun'],['eco']];
  const list=ORDER.filter(k=>tab==='all'||B[k].cat===tab);
  $('#dock').innerHTML=`<button class="grab" id="grab" aria-label="toggle"></button>
  <div class="tabs" role="tablist">${tabs.map(([k,ic,col])=>`<button class="tab${tab===k?' on':''}" role="tab" data-tab="${k}">${ico(ic||CAT[k].ic,'color:'+(col||CAT[k].col))}${t(k)}</button>`).join('')}</div>
  <div class="rail">${list.map(k=>{const b=B[k];return`<button class="card" data-b="${k}"><i class="dot" style="background:${CAT[b.cat].col}"></i><span class="sz">${b.w}×${b.h}</span><img src="${SRC(k)}" alt="" draggable="false"><span class="n">${esc(bn(k))}</span><span class="c">${COIN}${fmt(b.cost)}</span></button>`}).join('')}</div>`;
  $('#grab').onclick=()=>$('#dock').classList.toggle('min');
  for(const el of document.querySelectorAll('#dock .tab'))el.onclick=()=>{tab=el.dataset.tab;snd('tap');$('#dock').classList.remove('min');renderDock();refresh();};
  for(const el of document.querySelectorAll('#dock .card'))el.onclick=()=>startPlace(el.dataset.b);
}
function chipsFor(b){const c=CAT[b.cat];let h=`<span class="chip" style="color:#be185d">${fico('spark','#db2777')}+${b.attract}</span>`;
  h+=`<span class="chip" style="color:${b.pol<0?'#15803d':'#6b5a48'}">${fico('cloud',b.pol<0?'#16a34a':'#9a8a76')}${b.pol>0?'+':''}${b.pol}</span>`;
  if(b.cap)h+=`<span class="chip" style="color:${c.col}">${ico(c.ic)}+${b.cap}</span>`;
  return h+`<span class="chip">${ico('grid','color:#a08a6c')}${b.w}×${b.h}</span>`}
function showDock(){$('#act').hidden=true;$('#dock').hidden=false;}
function showAct(){$('#dock').hidden=true;$('#act').hidden=false;renderAct();}
function renderAct(){
  const type=mode==='place'?placing:mode==='move'?moving.type:selected?selected.type:null;if(!type)return;const b=B[type],c=CAT[b.cat];let btns;
  if(mode==='place')btns=`<button class="btn sec narrow" data-a="cancel" id="bCancel">${ghost?t('cancel'):t('done')}</button><button class="btn" data-a="ok" id="bOk">${ico('check')}${t('build')} · ${COIN}${fmt(b.cost)}</button>`;
  else if(mode==='move')btns=`<button class="btn sec narrow" data-a="cancel">${t('cancel')}</button><button class="btn" data-a="ok" id="bOk">${ico('check')}${t('placeHere')}</button>`;
  else btns=`<button class="btn sec" data-a="move">${ico('move')}${t('move')}</button><button class="btn ${sellArmed?'danger':'warn'}" data-a="sell">${COIN}${sellArmed?t('confirmSell'):t('sell')} +${fmt(Math.floor(b.cost*.5))}</button>`;
  $('#act').innerHTML=`<div class="top"><img class="thumb" src="${SRC(type)}" alt=""><div class="info"><div class="cat" style="color:${c.col}">${t(b.cat)}</div><h3>${esc(bn(type))}</h3><div class="chips">${chipsFor(b)}</div></div>
    <button class="ib x" data-a="cancel" aria-label="${t('close')}">${ico('x')}</button></div><div class="hint" id="hint"></div><div class="btns">${btns}</div>`;
  for(const el of document.querySelectorAll('#act [data-a]'))el.onclick=()=>{const a=el.dataset.a;if(a==='cancel'){snd('tap');exitMode();}else if(a==='ok')confirmGhost();else if(a==='move')startMove();else if(a==='sell')sellSelected();};
  updateHint();
}
function updateHint(){const h=$('#hint');if(!h||$('#act').hidden)return;const okB=$('#bOk');let txt='',bad=false,dis=false;
  if(mode==='place'){const b=B[placing];if(!ghost){txt=t('hintAgain');dis=true;}else if(S.tik<b.cost){txt=t('hintPoor',{n:fmt(b.cost-S.tik)});bad=dis=true;}
    else if(!canPlace(placing,ghost.c,ghost.r)){txt=t('hintTaken');bad=dis=true;}else txt=t('hintDrag');}
  else if(mode==='move'){if(ghost&&!canPlace(ghost.type,ghost.c,ghost.r)){txt=t('hintTaken');bad=dis=true;}else txt=t('hintMove');}
  else txt=t('hintSel');
  h.textContent=txt;h.classList.toggle('bad',bad);if(okB)okB.disabled=dis;
  const cb=$('#bCancel');if(cb)cb.textContent=ghost?t('cancel'):t('done');}

const prev={};
function setNum(sel,val,txt){const el=$(sel);if(!el)return;const s=txt??fmt(val);if(el.textContent!==s){el.textContent=s;if(prev[sel]!==undefined){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}}prev[sel]=val;}
function refresh(){const d=derive();
  $('#vName').textContent=t('beach')+' '+S.name;
  setNum('#vTik',S.tik);$('#vInc').textContent='+'+d.income+' '+t('per10');
  setNum('#vVis',S.visitors);setNum('#vAtt',d.eff);setNum('#vPol',d.pollution);
  const pc=d.pollution===0?'#16a34a':d.pollution<60?'#d97706':'#dc2626';$('#polV').firstElementChild.setAttribute('fill',pc);$('#polV').firstElementChild.setAttribute('stroke',pc);
  for(const c of['lodging','food','fun']){const el=$('#m_'+c),cap=d.caps[c];el.querySelector('span').textContent=fmt(S.visitors)+'/'+fmt(cap);
    el.querySelector('i').style.width=Math.min(100,S.visitors/cap*100)+'%';el.classList.toggle('over',d.over[c]);}
  for(const el of document.querySelectorAll('#dock .card'))el.classList.toggle('no',S.tik<B[el.dataset.b].cost);
  $('#bSound').innerHTML=ico(S.sound?'sound':'mute');$('#bSound').setAttribute('aria-label',t(S.sound?'soundOn':'soundOff'));
  updateHint();
}
function toast(msg,kind,otico,ms){const box=$('#toasts');if(!box)return;while(box.children.length>1)box.firstChild.remove();
  const el=document.createElement('div');el.className='toast '+(kind||'')+(otico?'':' plain');el.innerHTML=(otico?`<img src="${SRC('otico')}" alt="">`:'')+`<span>${esc(msg)}</span>`;
  box.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},ms||2400);}

/* ---------- sheets ---------- */
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;m.onclick=e=>{if(e.target===m)closeModal()};
  const x=m.querySelector('[data-x]');if(x)x.onclick=closeModal;snd('tap');}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';}
const head=(title,img)=>`<h2>${img?`<img src="${SRC('otico')}" alt="">`:''}${title}<button class="ib" data-x aria-label="${t('close')}">${ico('x')}</button></h2>`;
function openHelp(){
  const rules=[['r1','plus','#d1fae5','#047857'],['r2','spark','#fce7f3','#be185d'],['r3','bed','#dbeafe','#1d4ed8'],['r4','leaf','#dcfce7','#15803d'],['r5','grid','#fef3c7','#b45309'],['r6','move','#ede9fe','#6d28d9']];
  openModal(head(t('help'),true)+rules.map(([k,ic,bg,col])=>`<div class="rule"><div class="bx" style="background:${bg};color:${col}">${ico(ic)}</div><div>${t(k)}</div></div>`).join('')+
    `<div class="sub">${t('language')}</div><div class="seg"><button data-l="es" class="${lang==='es'?'on':''}">Español</button><button data-l="en" class="${lang==='en'?'on':''}">English</button></div>
     <div class="btns" style="margin-top:14px"><button class="btn sec" id="bDemo">${t('demo')}</button><button class="btn sec" id="bReset" style="color:#b91c1c">${t('reset')}</button></div>`);
  for(const el of document.querySelectorAll('#modal [data-l]'))el.onclick=()=>{lang=S.lang=el.dataset.l;save();buildUI();openHelp();};
  $('#bDemo').onclick=()=>{loadDemo();closeModal();toast(t('demoLoaded'),'good');};
  let armed=false;$('#bReset').onclick=()=>{if(!armed){armed=true;$('#bReset').textContent=t('resetSure');return;}
    exitMode();S.items=[];S.tik=500;S.visitors=0;S.name='Tikolones';walkers.length=0;rebuild();save();refresh();closeModal();};
}
function openReport(){const d=derive(),pct=x=>Math.round(x*100)+'%';
  let arr;if(d.any&&S.visitors>10)arr=`<b class="neg">${t('leaving')}</b>`;else if(d.eff>0&&!d.any)arr=`<b class="pos">${t('perMin',{n:(Math.log2(d.eff+1)/15*6).toFixed(1)})}</b>`;else arr=`<b>${t('none')}</b>`;
  let h=head(t('report'),true);
  h+=`<div class="kv"><span>${t('income')}</span><b class="pos">+${d.income} ${t('tik')} ${t('per10')}</b></div><div class="kv"><span>${t('arrivals')}</span>${arr}</div>`;
  h+=`<div class="sub">${t('att')}</div><div class="kv"><span>${t('baseAtt')}</span><b>${fmt(d.att)}</b></div>`;
  if(d.pollution>0)h+=`<div class="kv"><span>${t('modPol',{n:d.pollution})}</span><b class="neg">−${pct(1-d.pf)}</b></div>`;
  if(d.any)h+=`<div class="kv"><span>${t('modOver')}</span><b class="neg">−90%</b></div>`;
  if(d.df<1)h+=`<div class="kv"><span>${t('modDens',{n:Math.round(d.dens*100)})}</span><b class="neg">−${pct(1-d.df)}</b></div>`;
  h+=`<div class="kv"><span>${t('effAtt')}</span><b>${fmt(d.eff)}</b></div><div class="sub">${t('capacity')}</div>`;
  for(const c of['lodging','food','fun'])h+=`<div class="kv"><span style="display:flex;gap:6px;align-items:center;color:${CAT[c].col}">${ico(CAT[c].ic)}${t(c)}</span><b class="${d.over[c]?'neg':''}">${fmt(S.visitors)} / ${fmt(d.caps[c])}</b></div>`;
  openModal(h);}
function openRename(){openModal(head(t('rename'),true)+`<input id="inName" maxlength="20" value="${esc(S.name)}" autocomplete="off" enterkeyhint="done"><div class="btns" style="margin-top:12px"><button class="btn" id="bSave">${ico('check')}${t('save')}</button></div>`);
  const inp=$('#inName'),go=()=>{const v=inp.value.trim();if(v){S.name=v;save();refresh();}closeModal();};$('#bSave').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go();};setTimeout(()=>inp.focus(),80);}

function loadDemo(){exitMode();const L=[['hotel',3,3],['cabanas',8,3],['cabanas',11,3],['restaurante',15,4],['soda',20,5],['deportes',4,17],['surf',9,19],['inflable',14,18],
  ['artesanias',19,12],['pipas',10,12],['reciclaje1',7,12],['reciclaje2',16,10],['sombrilla',3,22],['sombrilla',5,22],['sombrilla',7,22],['sombrilla',12,22],['sombrilla',17,22],
  ['sombrilla',19,22],['sombrilla',21,22],['palmera',1,1],['palmera',7,2],['palmera',14,2],['palmera',19,3],['palmera',23,2],['palmera',2,8],['palmera',6,9],['palmera',13,9],
  ['palmera',22,9],['palmera',1,14],['palmera',8,15],['palmera',17,15],['palmera',23,16],['palmera',12,20],['palmera',22,20]];
  S.items=L.map(([type,c,r])=>({id:uid(),type,c,r}));S.tik=2400;S.visitors=86;walkers.length=0;rebuild();save();refresh();}

/* ---------- boot ---------- */
resize();
PAT.canopy=ctx.createPattern(makeCanopy(),'repeat');
function bakeAll(){PAT.sandTile=makeSandTile();PAT.sand=ctx.createPattern(PAT.sandTile,'repeat');bakeSand();}
bakeAll();IMG.sand_pattern.addEventListener('load',bakeAll);
const setCaust=()=>{PAT.caust=ctx.createPattern(IMG.water_caustics,'repeat');};
if(ok(IMG.water_caustics))setCaust();else IMG.water_caustics.addEventListener('load',setCaust);
rebuild();buildUI();
cam.z=Math.max(zmin(),Math.min(.95,vw/680));{const p=iso(12.5,14.5);cam.x=p.x;cam.y=p.y;clampCam();}
if(new URLSearchParams(location.search).has('demo'))loadDemo();
if(!S.items.length)setTimeout(()=>toast(t('welcome'),'',true,7000),700);
addEventListener('pointerdown',()=>{if(AC&&AC.state==='suspended')AC.resume();},{passive:true});
requestAnimationFrame(frame);
</script>
</body>
</html>
